name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Safety net, not a fix: the test suite normally finishes in ~1-2
    # minutes. It hung for over an hour twice during development (a real
    # unmocked DNS lookup once, real-time retry backoff sleeps in
    # chaos-heavy tests once -- both since fixed, see BUILD_LOG.md) before
    # anything caught it. A hard ceiling means a *future* regression like
    # either one fails loudly and fast instead of silently burning CI
    # minutes for hours.
    timeout-minutes: 10
    env:
      # Diagnostic: if a test hangs, dump the interpreter's thread stacks
      # instead of just sitting there. Combined with pytest-timeout below,
      # a hang now reports the stuck frame instead of only the job-level
      # 10-minute ceiling firing with no other information.
      PYTHONFAULTHANDLER: "1"
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy --strict
        run: mypy --strict src/

      - name: pytest with coverage
        # No secrets, no network: DO_INFERENCE_KEY is never set in CI, so the
        # app always constructs MockProvider (see api/routes.py). This is
        # what "the entire test suite runs with zero network and zero API
        # keys" (instructions.md §2) means in practice, not just in prose.
        #
        # --timeout=60 --timeout-method=thread: diagnostic for an
        # intermittent hang on this exact matrix leg (see BUILD_LOG.md) --
        # three speculative fixes landed without a traceback to confirm
        # any of them. thread-method timeout dumps every thread's stack on
        # timeout, naming the stuck test and the exact stuck line, so a
        # recurrence fails in ~1 minute with a diagnosis instead of
        # stalling for the full 10-minute job ceiling with no information.
        run: pytest --cov=src/batchengine --cov-report=xml --cov-report=term --cov-fail-under=85 --timeout=60 --timeout-method=thread

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t batchengine:ci .
