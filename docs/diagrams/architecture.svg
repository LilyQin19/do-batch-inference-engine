<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1010" viewBox="0 0 1240 1010">
<defs>
<marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8 z" fill="#5A6672"/></marker>
<marker id="ahb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8 z" fill="#1F3A5F"/></marker>
</defs>
<rect x="0" y="0" width="1240" height="1010" fill="#FFFFFF"/>

<text x="40" y="44" font-family="Segoe UI,Arial" font-size="25" font-weight="700" fill="#1F3A5F">Batch Inference Engine — Component Architecture</text>
<text x="40" y="70" font-family="Segoe UI,Arial" font-size="15" fill="#5A6672">One asyncio task per job. The API layer knows nothing of execution; the scheduler knows nothing of HTTP.</text>

<rect x="40" y="92" width="360" height="66" rx="8" fill="#1F3A5F"/>
<text x="60" y="120" font-family="Segoe UI,Arial" font-size="17" font-weight="700" fill="#FFFFFF">POST /job</text>
<text x="60" y="142" font-family="Segoe UI,Arial" font-size="13" fill="#C8D6E8">stat-only validation · returns 202 in &lt;50ms</text>
<rect x="420" y="92" width="400" height="66" rx="8" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.5"/>
<text x="440" y="118" font-family="Segoe UI,Arial" font-size="15" font-weight="600" fill="#1F3A5F">Scheduler — JobRunner</text>
<text x="440" y="140" font-family="Segoe UI,Arial" font-size="12.5" fill="#5A6672">lifecycle · wiring · final status · asserts conservation</text>
<line x1="400" y1="125" x2="418" y2="125" stroke="#1F3A5F" stroke-width="2" marker-end="url(#ahb)"/>
<line x1="220" y1="158" x2="220" y2="188" stroke="#5A6672" stroke-width="2" marker-end="url(#ah)"/>

<rect x="40" y="190" width="1160" height="104" rx="10" fill="#EAF2FE" stroke="#1F6FEB" stroke-width="1.5"/>
<text x="60" y="214" font-family="Segoe UI,Arial" font-size="13" font-weight="700" fill="#1F6FEB">ZONE 1 — INGESTION TRACK</text>
<rect x="60" y="226" width="300" height="52" rx="7" fill="#FFFFFF" stroke="#1F6FEB" stroke-width="1.3"/>
<text x="78" y="248" font-family="Segoe UI,Arial" font-size="14.5" font-weight="600" fill="#12233A">core/ingest.py</text>
<text x="78" y="267" font-family="Segoe UI,Arial" font-size="12" fill="#5A6672">ijson streaming · never json.load()</text>
<rect x="382" y="226" width="270" height="52" rx="7" fill="#FFFFFF" stroke="#1F6FEB" stroke-width="1.3"/>
<text x="400" y="248" font-family="Segoe UI,Arial" font-size="14.5" font-weight="600" fill="#12233A">Format sniff</text>
<text x="400" y="267" font-family="Segoe UI,Arial" font-size="12" fill="#5A6672">JSON array or JSONL</text>
<rect x="674" y="226" width="300" height="52" rx="7" fill="#FFFFFF" stroke="#1F6FEB" stroke-width="1.3"/>
<text x="692" y="248" font-family="Segoe UI,Arial" font-size="14.5" font-weight="600" fill="#12233A">Row validation</text>
<text x="692" y="267" font-family="Segoe UI,Arial" font-size="12" fill="#5A6672">bad row → invalid_input, stream continues</text>
<text x="996" y="252" font-family="Segoe UI,Arial" font-size="12.5" font-style="italic" fill="#1F6FEB">memory: O(1) per row</text>
<line x1="220" y1="294" x2="220" y2="324" stroke="#5A6672" stroke-width="2" marker-end="url(#ah)"/>

<rect x="40" y="326" width="1160" height="122" rx="10" fill="#FFF4E0" stroke="#B26B00" stroke-width="1.5"/>
<text x="60" y="350" font-family="Segoe UI,Arial" font-size="13" font-weight="700" fill="#B26B00">ZONE 2 — BACKPRESSURE THROTTLING LAYER</text>
<rect x="60" y="362" width="470" height="70" rx="7" fill="#FFFFFF" stroke="#B26B00" stroke-width="1.3"/>
<text x="78" y="384" font-family="Segoe UI,Arial" font-size="14.5" font-weight="600" fill="#12233A">Bounded Queue — asyncio.Queue(concurrency × 4)</text>
<text x="78" y="404" font-family="Segoe UI,Arial" font-size="12" fill="#5A6672">Boundary 1: producer blocks when full</text>
<text x="78" y="422" font-family="Segoe UI,Arial" font-size="12" fill="#B26B00">bounds L → bounds memory</text>
<rect x="552" y="362" width="470" height="70" rx="7" fill="#FFFFFF" stroke="#B26B00" stroke-width="1.3"/>
<text x="570" y="384" font-family="Segoe UI,Arial" font-size="14.5" font-weight="600" fill="#12233A">Rate Limiter — TokenBucket + AIMD</text>
<text x="570" y="404" font-family="Segoe UI,Arial" font-size="12" fill="#5A6672">Boundary 2: paces λ against the 120 RPM quota</text>
<text x="570" y="422" font-family="Segoe UI,Arial" font-size="12" fill="#B26B00">429 → ×0.75 w/ 5s cooldown · honors reset header</text>
<text x="1044" y="398" font-family="Segoe UI,Arial" font-size="12.5" font-style="italic" fill="#B26B00">L = λ × W</text>
<line x1="220" y1="448" x2="220" y2="478" stroke="#5A6672" stroke-width="2" marker-end="url(#ah)"/>

<rect x="40" y="480" width="1160" height="196" rx="10" fill="#F2ECFC" stroke="#7A4FD1" stroke-width="1.5"/>
<text x="60" y="504" font-family="Segoe UI,Arial" font-size="13" font-weight="700" fill="#7A4FD1">ZONE 3 — SCATTER POOL SEGMENTATION</text>
<rect x="60" y="516" width="300" height="144" rx="7" fill="#FFFFFF" stroke="#7A4FD1" stroke-width="1.3"/>
<text x="78" y="538" font-family="Segoe UI,Arial" font-size="14.5" font-weight="600" fill="#12233A">Worker Pool — N tasks</text>
<rect x="78" y="552" width="120" height="26" rx="5" fill="#F2ECFC" stroke="#7A4FD1" stroke-width="1"/>
<text x="96" y="570" font-family="Segoe UI,Arial" font-size="12.5" fill="#12233A">Worker 1</text>
<rect x="210" y="552" width="120" height="26" rx="5" fill="#F2ECFC" stroke="#7A4FD1" stroke-width="1"/>
<text x="228" y="570" font-family="Segoe UI,Arial" font-size="12.5" fill="#12233A">Worker 2</text>
<rect x="78" y="586" width="252" height="26" rx="5" fill="#F2ECFC" stroke="#7A4FD1" stroke-width="1"/>
<text x="96" y="604" font-family="Segoe UI,Arial" font-size="12.5" fill="#12233A">Worker N</text>
<text x="78" y="634" font-family="Segoe UI,Arial" font-size="12" fill="#5A6672">acquire → call → classify →</text>
<text x="78" y="651" font-family="Segoe UI,Arial" font-size="12" fill="#5A6672">retry or emit terminal outcome</text>

<rect x="382" y="516" width="270" height="68" rx="7" fill="#FFFFFF" stroke="#7A4FD1" stroke-width="1.3"/>
<text x="400" y="538" font-family="Segoe UI,Arial" font-size="14.5" font-weight="600" fill="#12233A">Providers</text>
<text x="400" y="557" font-family="Segoe UI,Arial" font-size="12" fill="#5A6672">live DigitalOcean · mock (chaos)</text>
<text x="400" y="574" font-family="Segoe UI,Arial" font-size="12" fill="#5A6672">shared pooled httpx.AsyncClient</text>
<rect x="382" y="592" width="270" height="68" rx="7" fill="#FFFFFF" stroke="#7A4FD1" stroke-width="1.3"/>
<text x="400" y="614" font-family="Segoe UI,Arial" font-size="14.5" font-weight="600" fill="#12233A">Retry &amp; Classify</text>
<text x="400" y="633" font-family="Segoe UI,Arial" font-size="12" fill="#5A6672">full jitter · retry budget 20%</text>
<text x="400" y="650" font-family="Segoe UI,Arial" font-size="12" fill="#5A6672">circuit breaker</text>

<rect x="674" y="516" width="300" height="144" rx="7" fill="#FFFFFF" stroke="#7A4FD1" stroke-width="1.3"/>
<text x="692" y="538" font-family="Segoe UI,Arial" font-size="14.5" font-weight="600" fill="#12233A">Failure taxonomy</text>
<text x="692" y="560" font-family="Segoe UI,Arial" font-size="12" fill="#5A6672">429 → throttled, retry + AIMD</text>
<text x="692" y="578" font-family="Segoe UI,Arial" font-size="12" fill="#5A6672">5xx / timeout → transient, retry</text>
<text x="692" y="596" font-family="Segoe UI,Arial" font-size="12" fill="#5A6672">400 / 422 / 413 → invalid_input</text>
<text x="692" y="614" font-family="Segoe UI,Arial" font-size="12" font-weight="600" fill="#B0341A">401 / 403 → fatal_auth · abort job</text>
<text x="692" y="632" font-family="Segoe UI,Arial" font-size="12" font-weight="600" fill="#B0341A">402 → fatal_billing · abort job</text>
<text x="692" y="652" font-family="Segoe UI,Arial" font-size="12" fill="#7A4FD1">exceptions contained → no lost rows</text>
<rect x="996" y="516" width="184" height="144" rx="7" fill="#FFFFFF" stroke="#7A4FD1" stroke-width="1.3"/>
<text x="1014" y="538" font-family="Segoe UI,Arial" font-size="14.5" font-weight="600" fill="#12233A">Spend Guard</text>
<text x="1014" y="560" font-family="Segoe UI,Arial" font-size="12" fill="#5A6672">per-job cap</text>
<text x="1014" y="578" font-family="Segoe UI,Arial" font-size="12" fill="#5A6672">cross-run ledger</text>
<text x="1014" y="596" font-family="Segoe UI,Arial" font-size="12" fill="#5A6672">actual tokens,</text>
<text x="1014" y="613" font-family="Segoe UI,Arial" font-size="12" fill="#5A6672">never estimated</text>
<line x1="220" y1="676" x2="220" y2="706" stroke="#5A6672" stroke-width="2" marker-end="url(#ah)"/>

<rect x="40" y="708" width="1160" height="116" rx="10" fill="#E7F6EC" stroke="#1E8E4A" stroke-width="1.5"/>
<text x="60" y="732" font-family="Segoe UI,Arial" font-size="13" font-weight="700" fill="#1E8E4A">ZONE 4 — GATHER COLLECTION LAYER</text>
<rect x="60" y="744" width="470" height="64" rx="7" fill="#FFFFFF" stroke="#1E8E4A" stroke-width="1.3"/>
<text x="78" y="766" font-family="Segoe UI,Arial" font-size="14.5" font-weight="600" fill="#12233A">Result Sink — single writer</text>
<text x="78" y="785" font-family="Segoe UI,Arial" font-size="12" fill="#5A6672">append-only JSONL · fsync every 100 rows / 2s</text>
<text x="78" y="802" font-family="Segoe UI,Arial" font-size="12" fill="#1E8E4A">counters only in memory — never a results list</text>
<rect x="552" y="744" width="470" height="64" rx="7" fill="#FFFFFF" stroke="#1E8E4A" stroke-width="1.3"/>
<text x="570" y="766" font-family="Segoe UI,Arial" font-size="14.5" font-weight="600" fill="#12233A">Job Store — memory + SQLite</text>
<text x="570" y="785" font-family="Segoe UI,Arial" font-size="12" fill="#5A6672">counts · usage · backpressure telemetry</text>
<text x="570" y="802" font-family="Segoe UI,Arial" font-size="12" fill="#1E8E4A">survives process restart</text>
<rect x="1044" y="744" width="136" height="64" rx="7" fill="#FFFFFF" stroke="#1E8E4A" stroke-width="1.3"/>
<text x="1062" y="766" font-family="Segoe UI,Arial" font-size="13.5" font-weight="600" fill="#12233A">Extensions</text>
<text x="1062" y="784" font-family="Segoe UI,Arial" font-size="12" fill="#5A6672">Spaces</text>
<text x="1062" y="801" font-family="Segoe UI,Arial" font-size="12" fill="#5A6672">Webhook</text>

<line x1="295" y1="824" x2="295" y2="856" stroke="#5A6672" stroke-width="2" marker-end="url(#ah)"/>
<line x1="787" y1="824" x2="787" y2="856" stroke="#5A6672" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="858" width="470" height="52" rx="8" fill="#1F3A5F"/>
<text x="80" y="880" font-family="Segoe UI,Arial" font-size="15" font-weight="600" fill="#FFFFFF">GET /job/{id}/download</text>
<text x="80" y="899" font-family="Segoe UI,Arial" font-size="12" fill="#C8D6E8">streams JSONL · never materialized in memory</text>
<rect x="552" y="858" width="470" height="52" rx="8" fill="#1F3A5F"/>
<text x="572" y="880" font-family="Segoe UI,Arial" font-size="15" font-weight="600" fill="#FFFFFF">GET /job/{id}/status</text>
<text x="572" y="899" font-family="Segoe UI,Arial" font-size="12" fill="#C8D6E8">counts · cost · live backpressure telemetry</text>

<rect x="40" y="936" width="1160" height="48" rx="8" fill="#F4F6F8" stroke="#D4DAE0" stroke-width="1"/>
<text x="60" y="956" font-family="Segoe UI,Arial" font-size="12.5" font-weight="700" fill="#1F3A5F">INVARIANT</text>
<text x="146" y="956" font-family="Segoe UI,Arial" font-size="12.5" fill="#12233A">succeeded + failed == ingested — every item reaches exactly one terminal state, asserted in production and under chaos testing.</text>
<text x="60" y="975" font-family="Segoe UI,Arial" font-size="12.5" font-weight="700" fill="#1F3A5F">MEMORY</text>
<text x="146" y="975" font-family="Segoe UI,Arial" font-size="12.5" fill="#12233A">Peak RSS 37.5 MB at N=1,000 and 38.1 MB at N=500,000 — bounded by concurrency, not input size.</text>
</svg>
