<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
<path d="M0,0 L10,4 L0,8 z" fill="#5A6672"/></marker></defs>
<rect x="0" y="0" width="1240" height="470" fill="#FFFFFF"/>
<text x="40" y="38" font-family="Segoe UI,Arial" font-size="22" font-weight="700" fill="#1F3A5F">Job Lifecycle</text>
<text x="40" y="62" font-family="Segoe UI,Arial" font-size="14" fill="#5A6672">Terminal status is derived from counters at drain time, never assigned during execution.</text>

<rect x="40" y="96" width="176" height="62" rx="9" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.8"/>
<text x="128" y="124" text-anchor="middle" font-family="Segoe UI,Arial" font-size="16" font-weight="700" fill="#1F3A5F">QUEUED</text>
<text x="128" y="144" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11.5" fill="#5A6672">record persisted, 202 sent</text>

<line x1="216" y1="127" x2="286" y2="127" stroke="#5A6672" stroke-width="2" marker-end="url(#ah)"/>
<text x="251" y="118" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11" fill="#5A6672">task starts</text>

<rect x="288" y="96" width="196" height="62" rx="9" fill="#EAF2FE" stroke="#1F6FEB" stroke-width="1.8"/>
<text x="386" y="124" text-anchor="middle" font-family="Segoe UI,Arial" font-size="16" font-weight="700" fill="#1F6FEB">RUNNING</text>
<text x="386" y="144" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11.5" fill="#5A6672">ingest · dispatch · drain</text>

<line x1="484" y1="112" x2="700" y2="112" stroke="#5A6672" stroke-width="2" marker-end="url(#ah)"/>
<line x1="484" y1="140" x2="700" y2="196" stroke="#5A6672" stroke-width="2" marker-end="url(#ah)"/>
<line x1="484" y1="150" x2="700" y2="282" stroke="#5A6672" stroke-width="2" marker-end="url(#ah)"/>
<line x1="484" y1="156" x2="700" y2="368" stroke="#5A6672" stroke-width="2" marker-end="url(#ah)"/>

<rect x="702" y="86" width="230" height="54" rx="9" fill="#E7F6EC" stroke="#1E8E4A" stroke-width="1.8"/>
<text x="722" y="110" font-family="Segoe UI,Arial" font-size="15" font-weight="700" fill="#1E8E4A">SUCCEEDED</text>
<text x="722" y="129" font-family="Segoe UI,Arial" font-size="11.5" fill="#5A6672">failed == 0</text>

<rect x="702" y="172" width="230" height="54" rx="9" fill="#FFF4E0" stroke="#B26B00" stroke-width="1.8"/>
<text x="722" y="196" font-family="Segoe UI,Arial" font-size="15" font-weight="700" fill="#B26B00">PARTIAL</text>
<text x="722" y="215" font-family="Segoe UI,Arial" font-size="11.5" fill="#5A6672">some succeeded, some failed</text>

<rect x="702" y="258" width="230" height="54" rx="9" fill="#FCEDEA" stroke="#B0341A" stroke-width="1.8"/>
<text x="722" y="282" font-family="Segoe UI,Arial" font-size="15" font-weight="700" fill="#B0341A">FAILED</text>
<text x="722" y="301" font-family="Segoe UI,Arial" font-size="11.5" fill="#5A6672">fatal abort, or succeeded == 0</text>

<rect x="702" y="344" width="230" height="54" rx="9" fill="#F1F3F5" stroke="#5A6672" stroke-width="1.8"/>
<text x="722" y="368" font-family="Segoe UI,Arial" font-size="15" font-weight="700" fill="#4A5560">CANCELLED</text>
<text x="722" y="387" font-family="Segoe UI,Arial" font-size="11.5" fill="#5A6672">cancel requested, in-flight drained</text>

<rect x="960" y="86" width="240" height="312" rx="9" fill="#F4F6F8" stroke="#D4DAE0" stroke-width="1.2"/>
<text x="980" y="112" font-family="Segoe UI,Arial" font-size="13" font-weight="700" fill="#1F3A5F">DERIVATION ORDER</text>
<text x="980" y="138" font-family="Segoe UI,Arial" font-size="12" fill="#12233A">1.  cancelled, if requested</text>
<text x="980" y="160" font-family="Segoe UI,Arial" font-size="12" fill="#12233A">2.  failed, if fatal abort</text>
<text x="980" y="182" font-family="Segoe UI,Arial" font-size="12" fill="#12233A">3.  succeeded, if failed == 0</text>
<text x="980" y="204" font-family="Segoe UI,Arial" font-size="12" fill="#12233A">4.  failed, if succeeded == 0</text>
<text x="980" y="226" font-family="Segoe UI,Arial" font-size="12" fill="#12233A">5.  otherwise partial</text>
<line x1="980" y1="244" x2="1180" y2="244" stroke="#D4DAE0" stroke-width="1"/>
<text x="980" y="268" font-family="Segoe UI,Arial" font-size="13" font-weight="700" fill="#1F3A5F">DURABILITY</text>
<text x="980" y="292" font-family="Segoe UI,Arial" font-size="12" fill="#12233A">Status persisted every 25</text>
<text x="980" y="310" font-family="Segoe UI,Arial" font-size="12" fill="#12233A">ingested items and at every</text>
<text x="980" y="328" font-family="Segoe UI,Arial" font-size="12" fill="#12233A">transition, so a restarted</text>
<text x="980" y="346" font-family="Segoe UI,Arial" font-size="12" fill="#12233A">process can serve a job it</text>
<text x="980" y="364" font-family="Segoe UI,Arial" font-size="12" fill="#12233A">did not run.</text>

<rect x="40" y="418" width="892" height="36" rx="7" fill="#F4F6F8" stroke="#D4DAE0" stroke-width="1"/>
<text x="60" y="441" font-family="Segoe UI,Arial" font-size="12.5" fill="#12233A">Before the final record is persisted the scheduler asserts succeeded + failed == ingested — the invariant is enforced in production code, not only in tests.</text>
</svg>
