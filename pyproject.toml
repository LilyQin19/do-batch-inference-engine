[project]
name = "batchengine"
version = "0.1.0"
description = "Batch inference engine REST API service for DigitalOcean Serverless Inference"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx[http2]>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "ijson>=3.3",
    "aiosqlite>=0.20",
    "structlog>=24.4",
    "python-ulid>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    "psutil>=6.0",
]
spaces = ["aioboto3>=13.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
exclude = ["tests/", "scripts/"]

[[tool.mypy.overrides]]
module = ["ijson.*", "aioboto3.*"]
ignore_missing_imports = true
